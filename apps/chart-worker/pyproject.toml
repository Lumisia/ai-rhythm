[project]
name = "chart-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "librosa>=0.10",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "soundfile>=0.12",
  "typer>=0.12",
]

[project.optional-dependencies]
timing = ["beat-this==1.1.0"]

[project.scripts]
chart-worker = "chart_worker.cli:app"

[dependency-groups]
dev = ["hypothesis>=6.100", "pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chart_worker"]

[tool.hatch.build.targets.wheel.force-include]
"patches" = "chart_worker/patches"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/patches",
  "/scripts",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "ffmpeg: 실제 FFmpeg 설치가 필요하다. 없으면 건너뛴다.",
  "librosa: librosa 진단 extra가 필요하다. 없으면 건너뛴다.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
