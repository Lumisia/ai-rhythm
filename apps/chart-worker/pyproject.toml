[project]
name = "chart-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["hypothesis>=6.100", "pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chart_worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["ffmpeg: 실제 FFmpeg 설치가 필요하다. 없으면 건너뛴다."]

[tool.ruff]
line-length = 100
target-version = "py311"
